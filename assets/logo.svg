<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" role="img" aria-label="Sky Bridge">
  <title>Sky Bridge</title>
  <rect width="64" height="64" rx="14" fill="#0e1322"/>
  <!-- a small star in the sky -->
  <g stroke="#e9ebf1" stroke-width="1.4" stroke-linecap="round">
    <path d="M55 5v7M51.5 8.5h7"/>
  </g>
  <!-- the bridge: deck, towers, main and side cables, hangers -->
  <g fill="none" stroke="#8a93a8" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2.6" d="M4 44h56M18 44V22M46 44V22"/>
    <path stroke-width="2" d="M18 22q14 18 28 0M18 22q-8 2-14 14M46 22q8 2 14 14"/>
    <path stroke-width="1.2" d="M25 28.75V44M32 31V44M39 28.75V44"/>
  </g>
  <!-- the telescope, over the bridge -->
  <g fill="none" stroke="#e9a23b" stroke-linecap="round" stroke-linejoin="round">
    <path stroke-width="2.6" d="M32 35L21 58M32 35L43 58M32 35V56"/>
    <path stroke-width="6" d="M20 49L46 16"/>
    <path stroke-width="9" d="M45.5 16.5L50 11"/>
    <path stroke-width="3" d="M20 49l-4 5"/>
  </g>
</svg>
